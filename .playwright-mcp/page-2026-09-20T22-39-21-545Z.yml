        - heading "About" [level=2] [ref=e567]
        - generic [ref=e569]:
          - paragraph [ref=e570]: Following the sellout success of its first tour in 2018/19, Matilda The Musical, the multi-award winning musical from the Royal Shakespeare Company, inspired by the beloved book by Roald Dahl, is heading back out on tour across the UK and Ireland from October 2025.
          - paragraph [ref=e571]: With book by Dennis Kelly, music and lyrics by Tim Minchin, Matilda is the story of an extraordinary little girl who, armed with a vivid imagination and a sharp mind, dares to take a stand and change her own destiny.
          - paragraph [ref=e572]: Winner of over 100 international awards, including 24 for Best Musical, the ‘unique and unforgettable’ (Rolling Stone) global phenomenon, Matilda has now delighted over 12 million audiences worldwide.
